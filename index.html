<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="assets/images/favicon/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon/favicon-32.png">
<link rel="alternate icon" href="favicon.ico">
<link rel="apple-touch-icon" href="assets/images/favicon/apple-touch-icon.png">
<meta name="theme-color" content="#0b2f5c">
  <title>Hastane360</title>
  <meta name="description" content="Hastane360">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- GİRİŞ (INTRO) EKRANI -->
  <section id="intro">
    <div class="intro-bg"></div>

    <div class="intro-inner">
      <div class="logo-pulse">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="46" class="ring"/>
          <path d="M40 20h20v20h20v20H60v20H40V60H20V40h20z" class="cross"/>
        </svg>
      </div>

      <h1 class="intro-title">Hastane360</h1>
      <p class="intro-sub">Sağlık sektöründe idari işlere pratik çözümler.</p>

      <svg class="ecg" viewBox="0 0 600 80" preserveAspectRatio="none" aria-hidden="true">
        <polyline points="0,40 120,40 150,40 165,10 185,70 205,25 220,40 330,40 360,40 375,10 395,70 415,25 430,40 600,40"/>
      </svg>

      <form class="arama" id="aramaForm" role="search" action="https://www.google.com/search" method="get">
        <input id="aramaKutu" class="arama-kutu" type="search" name="q" placeholder="Google'da ara..." aria-label="Google'da ara" autocomplete="off" enterkeyhint="search">
        <button class="arama-btn" type="submit" aria-label="Ara" title="Ara">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
      </form>

      <div class="intro-actions">
        <button class="enter-btn" type="button" data-modal="quick" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
          <span>Hızlı Erişim</span>
        </button>
        <button class="enter-btn" type="button" data-modal="tools" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          <span>Araçlar</span>
        </button>
        <button class="enter-btn" type="button" data-modal="programs" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
          <span>Programlar</span>
        </button>
        <button class="enter-btn" type="button" data-modal="docs" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>
          <span>Belgeler</span>
        </button>
        <button class="enter-btn" type="button" data-modal="faq" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1 1-1.1 1.8"/><path d="M12 17h.01"/></svg>
          <span>Sık Sorulan Sorular</span>
        </button>
      </div>

    </div>
    <p id="skipHint" class="skip-hint">Animasyonu geçmek için bir tuşa basın</p>
    <p class="intro-foot">Copyright &copy; <span id="yilIntro">2026</span> Hastane360. Tüm hakları saklıdır.</p>
  </section>

  <!-- AÇILIR PENCERE (Hızlı Erişim / Araçlar) -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button id="modalClose" class="modal-close" type="button" aria-label="Kapat">&times;</button>
      </div>
      <div id="modalGrid" class="link-grid light modal-grid"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

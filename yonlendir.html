<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harici Site Yönlendirmesi - Hastane Portal</title>
  
  <base href="https://sabriaydin.github.io/hastane/"> 
  
  <link rel="stylesheet" href="style.css">
  <script src="auth-check.js"></script>
</head>
<body class="dashboard-body">

  <div id="header-placeholder"></div>

  <main class="dashboard-container">
    <section class="panel">
      <div class="panel-header">HARİCİ SİTE YÖNLENDİRMESİ</div>
      <div class="panel-body" style="text-align: center; padding: 50px 20px;">
        <h3 style="margin-bottom: 15px; color: #2c3e50;">Güvenli Alandan Çıkıyorsunuz</h3>
        <p style="margin-bottom: 25px; color: #64748b;">Talep ettiğiniz bağlantı sizi harici bir web sitesine yönlendirecektir. Hedef sayfadan kaynaklanabilecek teknik, içeriksel veya güvenlik sorunlarından tarafımız sorumlu değildir.</p>
        
        <div style="font-size: 20px; font-weight: 600; margin-bottom: 35px; color: #334155;">
          <span id="kalan-sure" style="font-size: 32px; font-weight: 700; color: #5b758a;">10</span> saniye içinde yönlendiriliyorsunuz...
        </div>
        
        <div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
          <a id="yonlendir-buton" href="#" style="display: inline-block; background-color: #2c3e50; color: #ffffff; padding: 12px 32px; text-decoration: none; font-weight: bold; border: 1px solid #465c6f;">
            Beklemeden Git
          </a>
          <a href="anasayfa.html" style="display: inline-block; background-color: #ffffff; color: #2c3e50; padding: 12px 32px; text-decoration: none; font-weight: bold; border: 1px solid #cbd5e1;">
            Vazgeç
          </a>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="script.js"></script>

  <script>
    // URL adresindeki hedef linki otomatik yakalıyoruz
    const urlParametreleri = new URLSearchParams(window.location.search);
    const hedefUrl = urlParametreleri.get('url');

    if (hedefUrl) {
      // "Beklemeden Git" butonunun linkini hedef adrese kuruyoruz
      const buton = document.getElementById('yonlendir-buton');
      buton.href = hedefUrl;

      // 10 saniyelik geri sayım başlatıyoruz
      let saniye = 10;
      const sureMetni = document.getElementById('kalan-sure');

      const sayac = setInterval(() => {
        saniye--;
        sureMetni.textContent = saniye;

        if (saniye <= 0) {
          clearInterval(sayac);
          window.location.replace(hedefUrl); // Süre bitince otomatik yönlendirir
        }
      }, 1000);
    } else {
      // Eğer hatalı veya boş bir link gelirse doğrudan ana sayfaya gönderir
      window.location.replace("anasayfa.html");
    }
  </script>
</body>
</html>

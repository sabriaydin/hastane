---
layout: default
---

<article>
    <header class="mb-8 pb-4 border-b border-gray-200">
        <span class="text-xs text-gray-400">{{ page.date | date: "%d %B %Y" }}</span>
        <h1 class="text-2xl font-bold text-gray-900 mt-1">{{ page.title }}</h1>
    </header>

    <div class="text-gray-700 leading-relaxed space-y-4 text-sm">
        {{ content }}
    </div>

    <div class="mt-12 pt-6 border-t border-gray-200">
        <a href="{{ '/' | relative_url }}" class="text-xs font-medium text-gray-900 hover:underline">← Tüm yazılara dön</a>
    </div>
</article>
